{% macro icon(name, cls="") %}<svg class="i {{ cls }}" aria-hidden="true" focusable="false"><use href="/static/icons.svg#{{ name }}"></use></svg>{% endmacro %}
{% macro chip(name, value, label, logo=None, id=None) %}<label class="chip-toggle"><input type="checkbox" name="{{ name }}" value="{{ value }}"{% if id %} id="{{ id }}"{% endif %}><span class="chip-face">{% if logo %}<img src="{{ logo }}" alt="" loading="lazy">{% endif %}{{ label }}</span></label>{% endmacro %}
{% macro stepper(name, label, step, start, min, max, unit="") %}
<div class="stepper" data-step="{{ step }}" data-start="{{ start }}" data-min="{{ min }}" data-max="{{ max }}">
  <span class="stepper-label">{{ label }}</span>
  <div class="stepper-row">
    <button type="button" class="step-btn" data-dir="-1" aria-label="{{ label }} verringern">{{ icon("remove") }}</button>
    <input type="number" name="{{ name }}" min="{{ min }}" max="{{ max }}" step="any" inputmode="decimal" placeholder="egal" aria-label="{{ label }}">
    <button type="button" class="step-btn" data-dir="1" aria-label="{{ label }} erhöhen">{{ icon("add") }}</button>
  </div>
</div>
{% endmacro %}
