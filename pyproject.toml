[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filmzwilling"
version = "0.1.0"
description = "Persönliche Film-Empfehlungen über Geschmackszwillinge (MovieLens 32M + TMDB)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pandas>=2.1",
    "pyarrow>=14",
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.27",
    "rapidfuzz>=3.5",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "scipy-stubs",
]

[project.scripts]
filmzwilling = "filmzwilling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filmzwilling = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not e2e and not real_data' --strict-markers"
markers = [
    "slow: performance tests (pytest -m slow)",
    "e2e: browser end-to-end tests with Playwright (optional)",
    "real_data: tests against the real MovieLens 32M data (needs FILMZWILLING_REAL_DATA=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning:typer.*",
    # Starlette's TestClient recommends the httpx2 package; httpx works and is what the app uses.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["filmzwilling"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["filmzwilling.scale", "filmzwilling.similarity", "filmzwilling.recommender"]
strict = true
